name: Payroll PDF validation (isolated)
on:
  push:
    branches:
      - fix/payroll-pdf-validation-no-deploy
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded branch pushes, not manually requested validation.
concurrency:
  group: payroll-validation-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: local-test-key-not-a-secret
  CI: true

jobs:
  quality:
    name: Quality - unit, types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 verified on 2026-10-18
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 verified on 2026-10-18
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Synthetic ownership and governance regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: ESLint for sensitive validation modules
        run: npx eslint src/lib/slip-validation.ts src/lib/pdfjs-compat.ts src/lib/server src/app/api/admin src/app/api/payroll src/app/api/auth/route.ts src/app/api/send-line/route.ts src/app/api/line-webhook/route.ts
      - name: Full-project ESLint (required)
        run: npm run lint

  browser-e2e:
    name: Sandbox - build, PDF.js and browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 verified on 2026-10-18
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 verified on 2026-10-18
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 verified on 2026-10-18
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Build only (never deploy)
        run: npm run build
      - name: Install sandbox browser dependencies (test only)
        run: |
          python -m pip install reportlab==4.4.2
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-thai-tlwg fonts-noto-core
          fc-match 'Noto Sans Thai' | head -1
      - name: Private PDF.js helper against fully fictional layouts A, B, and odd last page
        run: node --test tests/private-payroll-pdf-fixtures.e2e.mjs
      - name: Browser E2E with mocked Sheets and Supabase
        run: node tests/browser-payroll.e2e.mjs

  # Retain historical aggregate check name. Both jobs must pass at exact SHA.
  validate:
    name: validate
    needs: [quality, browser-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require both independent suites
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success
