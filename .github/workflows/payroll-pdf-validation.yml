name: Payroll PDF validation (isolated)
on:
  push:
    branches:
      - fix/payroll-pdf-validation-no-deploy
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-test-key-not-a-secret
      NEXT_PUBLIC_STAFF_SHEET_URL: https://docs.google.com/spreadsheets/d/TEST_ROSTER_FAKE_DOC_NOT_PERSONAL_0001/edit?gid=0
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No production credentials, deploy command, or data access.
      - name: Install locked dependencies
        run: npm ci
      - name: Synthetic ownership regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: ESLint for new validation module
        run: npx eslint src/lib/slip-validation.ts src/lib/pdfjs-compat.ts src/lib/server src/app/api/admin src/app/api/payroll src/app/api/auth/route.ts
      - name: Full-project ESLint baseline (report only)
        continue-on-error: true
        run: npm run lint
      - name: Build only (never deploy)
        run: npm run build
      - name: Install sandbox browser dependencies (test only)
        run: |
          python -m pip install reportlab==4.4.2
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-thai-tlwg fonts-noto-core
          fc-match 'Noto Sans Thai' | head -1
      - name: Browser E2E with mocked Sheets and Supabase
        run: node tests/browser-payroll.e2e.mjs
