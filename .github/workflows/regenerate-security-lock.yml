name: Regenerate security lockfile (temporary)

on:
  push:
    branches:
      - chore/security-dependency-patch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate deterministic lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          node -e 'const p=require("./package.json"); const l=require("./package-lock.json"); if (p.dependencies.firebase) process.exit(2); if (p.dependencies.next !== "^16.4.2") process.exit(3); if (p.dependencies["pdfjs-dist"] !== "^6.4.299") process.exit(4); if (!l.lockfileVersion) process.exit(5)'
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "fix(security): regenerate dependency lockfile"
          git push origin HEAD:chore/security-dependency-patch
