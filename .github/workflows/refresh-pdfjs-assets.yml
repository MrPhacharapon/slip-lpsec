name: Temporary PDF.js assets refresh

on:
  push:
    branches:
      - chore/dependency-security-hardening

permissions:
  contents: write

jobs:
  refresh-assets:
    if: ${{ !contains(github.event.head_commit.message, '[pdfjs-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Rebuild complete lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Install and verify exact patched PDF.js
        run: |
          npm ci
          node -e 'const p=require("./node_modules/pdfjs-dist/package.json"); if (p.version !== "6.2.108") { console.error("Unexpected PDF.js version"); process.exit(1); }'
      - name: Require zero production vulnerabilities
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e 'const j=require("./audit.json"); if ((j.metadata?.vulnerabilities?.total ?? 1) !== 0) process.exit(1)'
          rm -f audit.json
      - name: Sync exact worker
        run: |
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs public/pdf.worker.min.mjs
          node -e 'const fs=require("fs"),crypto=require("crypto"),pkg=require("./node_modules/pdfjs-dist/package.json"); const a=fs.readFileSync("public/pdf.worker.min.mjs"),b=fs.readFileSync("node_modules/pdfjs-dist/build/pdf.worker.min.mjs"); if (!a.equals(b) || pkg.version !== "6.2.108") process.exit(1); console.log(JSON.stringify({pdfjs:pkg.version,bytes:a.length,sha256:crypto.createHash("sha256").update(a).digest("hex")}))'
      - name: Commit lockfile and worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/pdf.worker.min.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore(pdfjs): refresh exact patched assets [pdfjs-refresh]"
          git push origin HEAD:chore/dependency-security-hardening
