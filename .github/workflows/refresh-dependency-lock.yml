name: Temporary dependency lock refresh

on:
  push:
    branches:
      - chore/dependency-security-hardening

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate complete lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Require zero production vulnerabilities
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e 'const j=require("./audit.json"); if ((j.metadata?.vulnerabilities?.total ?? 1) !== 0) process.exit(1)'
          rm -f audit.json
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): regenerate lockfile [lock-refresh]"
          git push origin HEAD:chore/dependency-security-hardening
